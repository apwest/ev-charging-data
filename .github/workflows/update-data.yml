name: Update data

# Phase 3a: pull the Google Sheet, refresh weather, regenerate JSON, commit changes,
# then build + deploy from this same working tree.
#
# We deploy here directly (rather than letting the commit trigger deploy.yml) because
# pushes made with the default GITHUB_TOKEN do NOT trigger other workflows.
#
# Starts manual-only; uncomment the schedule once a manual run is verified green.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 11 * * *' # ~6-7am ET; adjust to taste

permissions:
  contents: write # push the data commit
  pages: write # deploy to Pages
  id-token: write

# Share the Pages concurrency group with deploy.yml so the two never publish at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull Google Sheet as CSV
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          curl -sL --fail "$SHEET_CSV_URL" -o "EV Charging Data - EV Charging.csv"
          echo "Pulled $(wc -l < 'EV Charging Data - EV Charging.csv') lines."

      - name: Fetch + build weather
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: npm run weather

      - name: Regenerate JSON
        run: npm run convert

      - name: Commit data changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "data: daily update ($(date -u +%Y-%m-%d))"
            git push
            echo "Committed data update."
          fi

      # Build + deploy from the working tree we just updated.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v4
